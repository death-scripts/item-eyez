name: CI

permissions:
  contents: read
  packages: read

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: windows-latest
    env:
      Configuration: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore item-eyez.sln

      - name: Build
        run: dotnet build item-eyez.sln -c $env:Configuration --no-restore

      - name: Test
        run: >-
          dotnet test Item-eyez.Tests/Item-eyez.Tests.csproj
          -c $env:Configuration --no-build
          --logger trx --results-directory .\TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/**/coverage.cobertura.xml
            TestResults/**/coverage.info
            TestResults/**/coverage.json
          if-no-files-found: ignore

      - name: Build MSI (WiX v4)
        run: dotnet build Item-eyez.Installer/Item-eyez.Installer.wixproj -c $env:Configuration

      - name: Clean Bundle intermediates
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue Item-eyez.Bootstrapper\bin
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue Item-eyez.Bootstrapper\obj
          dotnet clean Item-eyez.Bootstrapper/Item-eyez.Bootstrapper.wixproj -c $env:Configuration

      - name: Build Bundle (WiX v4)
        run: dotnet build Item-eyez.Bootstrapper/Item-eyez.Bootstrapper.wixproj -c $env:Configuration

      - name: Locate MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "Item-eyez.Installer/bin" -Recurse -Filter *.msi |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) { throw "MSI not found under Item-eyez.Installer/bin" }
          "msi_path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MSI path: $($msi.FullName)"

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ItemEyezInstaller
          path: ${{ env.msi_path }}
          if-no-files-found: error

      - name: Locate Bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path "Item-eyez.Bootstrapper/bin" -Recurse -Filter *.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $bundle) { throw "Bundle not found under Item-eyez.Bootstrapper/bin" }
          "bundle_path=$($bundle.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Bundle path: $($bundle.FullName)"

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ItemEyezBundle
          path: ${{ env.bundle_path }}
          if-no-files-found: error
